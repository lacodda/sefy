[workspace]
members = ["crates/sefy-core", "crates/sefy-cli"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/lacodda/sefy"
homepage = "https://github.com/lacodda/sefy"
authors = ["Kirill Lakhtachev <lahtachev@gmail.com>"]

[workspace.dependencies]
sefy-core = { path = "crates/sefy-core", version = "0.0.1" }

argon2 = "0.5"
base64 = "0.23"
chacha20poly1305 = { version = "0.11", features = ["alloc"] }
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled", "serialize"] }
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

anyhow = "1"
arboard = "3"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
rpassword = "7"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Argon2 is deliberately expensive, and an unoptimized build makes it about ten
# times more so: a debug `sefy ls` spends seconds deriving the key. Optimizing
# dependencies keeps the crypto fast in tests and development while this crate's
# own code stays debuggable.
[profile.dev.package."*"]
opt-level = 3

# The core crate is a workspace member, so the wildcard above does not cover it.
[profile.dev.package.sefy-core]
opt-level = 3
