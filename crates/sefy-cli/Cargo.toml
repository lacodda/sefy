[package]
name = "sefy"
description = "An inconspicuous encrypted store for notes, credentials and files"
keywords = ["cli", "secrets", "password-manager", "encryption", "vault"]
categories = ["command-line-utilities", "cryptography"]
# Outside the crate directory, but cargo pulls it into the package: verified by
# inspecting the built .crate rather than assumed.
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true

[[bin]]
name = "sefy"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
sefy-core.workspace = true

anyhow.workspace = true
arboard.workspace = true
clap.workspace = true
dialoguer.workspace = true
clap_complete.workspace = true
console.workspace = true
qrcodegen.workspace = true
rpassword.workspace = true
tempfile.workspace = true

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
# Only to decode the PNGs inside assets/icon.ico, so the icon gate can look at
# actual pixels rather than at file sizes: the defect it guards against - every
# entry rasterized from the same master - leaves a container that is perfectly
# well-formed. Default features off, `png` on: nothing else is read here.
image = { version = "0.25", default-features = false, features = ["png"] }
