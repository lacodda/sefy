<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sefy</title>
    <!--
      The first thing the window shows, before a line of the application has
      run: the mark, the name, the promise and the version, on the window's own
      background. It is here and not in React because React is what is still
      loading; the page takes it down on its first render.

      It says nothing about any vault - no file, no path, no count - and it
      could not if it wanted to: nothing has been asked yet.

      Inline styles rather than a stylesheet: the stylesheet arrives with the
      bundle, which is the thing being waited for. The colours are the theme's
      dark and light backgrounds with sefy's accent, written out, since the
      theme file is in that same bundle; `src/splash.test.ts` holds them to it.
    -->
    <style>
      html {
        background: #171a1d;
        color: #e2e5ea;
      }
      @media (prefers-color-scheme: light) {
        html {
          background: #ecf0f2;
          color: #26272d;
        }
      }
      html.dark {
        background: #171a1d;
        color: #e2e5ea;
      }
      html.light {
        background: #ecf0f2;
        color: #26272d;
      }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-family:
          'Segoe UI Variable Text',
          'Segoe UI',
          system-ui,
          -apple-system,
          sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      #splash .mark {
        width: 56px;
        height: 56px;
        margin-bottom: 6px;
      }
      #splash .name {
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 0.02em;
        line-height: 1;
      }
      #splash .tagline {
        font-size: 13px;
        opacity: 0.62;
      }
      #splash .version {
        margin-top: 6px;
        font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
        font-size: 11px;
        opacity: 0.45;
      }
      #splash .bar {
        position: relative;
        width: 160px;
        height: 2px;
        margin-top: 18px;
        border-radius: 999px;
        background: rgba(128, 128, 128, 0.18);
        overflow: hidden;
      }
      #splash .bar::after {
        content: '';
        position: absolute;
        top: 0;
        left: -40%;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #4ab9b1;
        animation: splash-sweep 1.1s ease-in-out infinite;
      }
      @keyframes splash-sweep {
        to {
          left: 100%;
        }
      }
      @media (prefers-color-scheme: light) {
        #splash .bar::after {
          background: #006f68;
        }
      }
      html.dark #splash .bar::after {
        background: #4ab9b1;
      }
      html.light #splash .bar::after {
        background: #006f68;
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .bar::after {
          animation: none;
          left: 0;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <!-- sefy's mark at the M level, as dowel ships it (dowel-ui/marks):
           the same picture the splash in React draws with ProductMark. -->
      <svg class="mark" viewBox="0 0 100 100">
        <polygon
          points="50,5 89,27.5 89,72.5 50,95 11,72.5 11,27.5"
          fill="#1B2126"
          stroke="#1B2126"
          stroke-width="9"
          stroke-linejoin="round"
        />
        <polygon
          points="50,5 89,27.5 89,72.5 50,95 11,72.5 11,27.5"
          fill="none"
          stroke="#35A8A0"
          stroke-opacity="0.75"
          stroke-width="3.5"
          stroke-linejoin="round"
        />
        <text
          x="50"
          y="64"
          text-anchor="middle"
          font-family='"Cascadia Code","JetBrains Mono",Consolas,ui-monospace,monospace'
          font-weight="700"
          font-size="40"
          fill="#35A8A0"
        >
          se
        </text>
      </svg>
      <div class="name">sefy</div>
      <div class="tagline">An inconspicuous encrypted vault.</div>
      <div class="version">v__APP_VERSION__</div>
      <div class="bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
