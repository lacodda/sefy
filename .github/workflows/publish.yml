name: Publish

# Triggered by the tag push directly (not the release event): releases here are
# created by release.yml with GITHUB_TOKEN, and such events do not start other
# workflows.
#
# crates.io now requires Trusted Publishing for this crate, so there is no
# token path left: a release goes out on its tag or not at all.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. v0.1.0)
        required: true

permissions: {}

jobs:
  crates-io:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Get a crates.io token (OIDC trusted publishing)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # Order matters: sefy depends on sefy-core, and crates.io will not accept
      # a package whose dependency it cannot resolve yet. `--package` twice
      # rather than a workspace publish, so the order is explicit.
      - name: Publish sefy-core
        run: cargo publish --package sefy-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      # The index does not carry the new version the instant publish returns,
      # and the next step resolves sefy-core from it. Waiting for the version
      # to appear beats a fixed sleep that is either too short or wasteful.
      - name: Wait for sefy-core to appear in the index
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          for attempt in $(seq 1 30); do
            if curl -sf "https://crates.io/api/v1/crates/sefy-core/$version" \
                 -H 'user-agent: sefy-release' > /dev/null; then
              echo "sefy-core $version is available"
              exit 0
            fi
            echo "attempt $attempt: not indexed yet"
            sleep 10
          done
          echo "sefy-core $version never appeared in the index" >&2
          exit 1
      - name: Publish sefy
        run: cargo publish --package sefy
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      # The transports depend on neither of the two above, so their order is
      # free. Both need two things done by hand once, and this step fails until
      # they are:
      #
      # 1. **The first version goes up manually.** crates.io refuses to create a
      #    crate from here: "Trusted Publishing tokens do not support creating
      #    new crates". Run `cargo publish --package <name>` once.
      # 2. **Trusted Publishing is configured for that crate.** Publishing by
      #    hand creates the crate but does not connect it to this repository,
      #    and the next run fails with "the provided access token is not valid
      #    for crate <name>" — which reads like a token problem and is not one.
      #    Add the publisher on the crate's Settings page on crates.io:
      #    repository lacodda/sefy, workflow publish.yml.
      #
      # Caught twice: 0.4.0 on step 1, 0.5.0 on step 2.
      - name: Publish sefy-plugin-github
        run: cargo publish --package sefy-plugin-github
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Publish sefy-plugin-sftp
        run: cargo publish --package sefy-plugin-sftp
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      # npm >= 11.5.1 exchanges the OIDC token itself (trusted publishing);
      # provenance is attached automatically.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # One README for all three pages: npm/package.json has a prepack script
      # that copies the root file in. Doing it there rather than as a step here
      # means a hand-run `npm publish` cannot forget it - which is exactly how
      # 0.1.1 reached npm with no README and a blank page.
      - run: npm publish
        working-directory: npm
