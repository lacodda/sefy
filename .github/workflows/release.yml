name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # The transports ship beside the CLI: a release that carries only sefy
      # would leave `sefy sync` with nothing to call.
      - name: Build
        run: >
          cargo build --release --target ${{ matrix.target }}
          -p sefy -p sefy-plugin-github -p sefy-plugin-sftp
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "sefy-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          $built = "target/${{ matrix.target }}/release"
          Copy-Item "$built/sefy.exe", "$built/sefy-plugin-github.exe", "$built/sefy-plugin-sftp.exe", "LICENSE", "README.md" $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="sefy-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/sefy" \
             "target/${{ matrix.target }}/release/sefy-plugin-github" \
             "target/${{ matrix.target }}/release/sefy-plugin-sftp" \
             LICENSE README.md "$name"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.target }}
          path: |
            sefy-*.zip
            sefy-*.tar.gz
          if-no-files-found: error

  # The desktop app, as each system installs an application: a per-user NSIS
  # installer on Windows, the .app on macOS, an AppImage on Linux. The names
  # are Tauri's own (`<productName>_<version>_<arch>`), and the installers in
  # tools/ fetch them by those names.
  bundle:
    name: desktop app (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: appimage
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app
    steps:
      - uses: actions/checkout@v7
      - name: Install the webview the desktop app builds against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: gui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: gui
      - name: Build the desktop app (tauri build)
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        working-directory: gui
      - name: Collect
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          bundle="target/${{ matrix.target }}/release/bundle"
          mkdir out
          case "${{ runner.os }}" in
            Windows) cp "$bundle/nsis/sefy_${version}_x64-setup.exe" out/ ;;
            Linux) cp "$bundle/appimage/sefy_${version}_amd64.AppImage" out/ ;;
            # An .app is a directory; it travels as a tarball, which keeps its
            # layout and the executable bit.
            macOS) tar czf "out/sefy_${version}_aarch64.app.tar.gz" -C "$bundle/macos" sefy.app ;;
          esac
          ls -l out
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  release:
    needs: [build, bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.cliff.outputs.content }}
          files: packages/*
