name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The desktop app is a workspace member, and Tauri builds against the
      # system's webview: WebKitGTK on Linux.
      - name: Install the webview the desktop app builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the webview the desktop app builds against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo test --workspace --all-features

  # rust-version is a promise to anyone running `cargo install`. Without a job
  # that actually builds on it, the number silently rots the first time a new
  # API is used — so read it from the manifest and hold it to it. The promise
  # is the published crates': the desktop app is not installed with cargo and
  # declares Tauri's own floor, so it is left out of this build.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version of the published crates
        id: msrv
        run: |
          echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '[.packages[] | select(.publish != []) | .rust_version] | max')" >> "$GITHUB_OUTPUT"
          echo "exclude=$(cargo metadata --no-deps --format-version 1 | jq -r '[.packages[] | select(.publish == []) | "--exclude " + .name] | join(" ")')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Build on the declared MSRV
        run: cargo check --workspace ${{ steps.msrv.outputs.exclude }} --all-targets --all-features

  # The desktop app's page: types, the line's lint rules, and its tests.
  gui:
    name: desktop app (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: gui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: gui
      - name: Lint and test
        run: pnpm lint
        working-directory: gui
      - name: Build
        run: pnpm build
        working-directory: gui
